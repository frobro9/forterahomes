<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="assets/favicon1.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Management portal sign-in for Fortera Homes.">
  <title>Management Portal Login | Fortera Homes</title>
  <link rel="canonical" href="https://forterahomes.ca/admin">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7X71SV3ET6"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-7X71SV3ET6');</script>
  <script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="admin-login-body">

  <div class="admin-login-page">
    <div class="admin-login-brand">
      <a href="/" class="admin-login-logo" aria-label="Fortera Homes">FORTERA</a>
      <p class="admin-login-tagline">Management Portal</p>
    </div>

    <div class="admin-login-card">
      <p class="admin-card-label">SIGN IN</p>
      <form id="adminLoginForm" novalidate>
        <div class="admin-card-field">
          <label for="adminEmail">Email</label>
          <input type="email" id="adminEmail" name="email" autocomplete="username" placeholder="you@forterahomes.ca">
        </div>
        <div class="admin-card-field">
          <label for="adminPassword">Password</label>
          <div class="admin-card-password">
            <input type="password" id="adminPassword" name="password" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
            <button type="button" class="admin-card-password-toggle" id="adminPasswordToggle" aria-label="Show password" aria-pressed="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="admin-card-row">
          <label class="admin-card-checkbox">
            <input type="checkbox" id="adminRemember" name="remember">
            <span>Remember me</span>
          </label>
          <a href="#" class="admin-card-forgot">Forgot password?</a>
        </div>
        <button type="submit" class="admin-card-submit">Sign In</button>
      </form>
    </div>

    <a href="/" class="admin-login-back">&#8592; Back to forterahomes.ca</a>
  </div>

  <script src="main.js"></script>

</body>
</html>
